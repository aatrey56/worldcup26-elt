name: CI

# Hermetic PR + push checks. Runs lint, a sample data load, dbt build (seeds +
# models + tests), and SQL lint. No API key or secret is used so any fork PR
# can run it green.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Absolute warehouse path inside the workspace so dbt and the loader agree.
  DUCKDB_PATH: ${{ github.workspace }}/include/data/warehouse.duckdb

jobs:
  lint-and-build:
    name: Lint, build, and test (hermetic)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python tooling
        # pandas + pyarrow back the dbt python model int_projected_r32 (the
        # projected-bracket resolver); dbt-duckdb needs them to land a python
        # model's dataframe.
        run: |
          python -m pip install --upgrade pip
          pip install ruff sqlfluff sqlfluff-templater-dbt dbt-duckdb==1.10.1 duckdb pandas pyarrow

      - name: Ruff lint
        run: ruff check .

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: Load committed sample data into DuckDB
        run: python -m include.extract.load_sample

      - name: dbt build (seeds, models, tests)
        working-directory: dbt
        # REPO_ROOT lets the int_projected_r32 python model import the resolver
        # in include/ (its cwd is the dbt project dir).
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: dbt build --profiles-dir .

      - name: SQLFluff lint dbt models
        # The dbt templater needs dbt deps installed and the warehouse present;
        # both are satisfied by the steps above. .sqlfluff points the templater
        # at project_dir=dbt / profiles_dir=dbt (relative to repo root), so this
        # runs from the repo root.
        run: sqlfluff lint dbt/models
