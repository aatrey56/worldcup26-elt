version: 2

models:
  - name: stg_schedule
    description: "One row per scheduled match (104), cleaned from the authoritative seed. is_placeholder flags knockout rows with non-country teams."
    columns:
      - name: match_no
        description: "Integer match number (1..104), unique per match."
        tests:
          - unique
          - not_null
      - name: stage
        description: "Tournament stage."
        tests:
          - accepted_values:
              values: ['group', 'r32', 'r16', 'qf', 'sf', 'third', 'final']
      - name: is_placeholder
        description: "True when home or away team is a placeholder (Winner/Runner-up/3rd/TBD)."
        tests:
          - not_null

  - name: stg_matches
    description: "One row per match from the football-data.org v4 matches feed (JSON extracted)."
    columns:
      - name: fixture_id
        description: "football-data.org match id."
        tests:
          - unique
          - not_null
      - name: kickoff_utc
        description: "Match kickoff in UTC, from utcDate."
        tests:
          - not_null
      - name: status
        description: "Raw football-data.org match status (e.g. TIMED, FINISHED)."
        tests:
          - not_null
      - name: home_team
        description: "Home team name (homeTeam.name), crosswalk-canonicalized. Null for undetermined knockout fixtures pre-tournament."
      - name: away_team
        description: "Away team name (awayTeam.name), crosswalk-canonicalized. Null for undetermined knockout fixtures pre-tournament."
      - name: home_team_tla
        description: "Home team three-letter FIFA code (homeTeam.tla, e.g. MEX)."
      - name: away_team_tla
        description: "Away team three-letter FIFA code (awayTeam.tla, e.g. KOR)."
      - name: stage
        description: "Tournament stage (e.g. GROUP_STAGE, LAST_16, FINAL)."
        tests:
          - not_null
      - name: last_updated
        description: "Provider's lastUpdated timestamp (payload.lastUpdated): when football-data.org last changed this match. Used as the incremental change-key for fct_result (source_loaded_at), so only matches the provider actually updated are reprocessed."

  - name: stg_standings
    description: "One row per team from the football-data.org v4 TOTAL standings table (JSON extracted). Auxiliary cross-check only."
    columns:
      - name: team_id
        description: "football-data.org team id."
        tests:
          - unique
          - not_null
      - name: team_name
        description: "Team name (team.name), crosswalk-canonicalized."
        tests:
          - not_null
      - name: team_tla
        description: "Team three-letter FIFA code (team.tla)."
      - name: group_label
        description: "Bare group letter A..L (the API 'GROUP_' prefix is stripped to match every other model)."
      - name: points
        description: "Total points."
        tests:
          - not_null

  - name: stg_teams
    description: "One row per real team (country) in the schedule, with optional API team_id and fifa_code (tla)."
    columns:
      - name: team_name
        description: "Country name as it appears in the schedule seed."
        tests:
          - unique
          - not_null
      - name: fifa_code
        description: "Three-letter FIFA code (API tla) for the team, from the fixtures or standings feed; null until the team is seen."

  - name: stg_venues
    description: "One row per distinct (venue, city) pair in the schedule."
    columns:
      - name: venue_name
        description: "Venue name."
        tests:
          - not_null
