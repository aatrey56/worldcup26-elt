version: 2

models:
  - name: stg_schedule
    description: "One row per scheduled match (104), cleaned from the authoritative seed. is_placeholder flags knockout rows with non-country teams."
    columns:
      - name: match_no
        description: "Integer match number (1..104), unique per match."
        tests:
          - unique
          - not_null
      - name: stage
        description: "Tournament stage."
        tests:
          - accepted_values:
              values: ['group', 'r32', 'r16', 'qf', 'sf', 'third', 'final']
      - name: is_placeholder
        description: "True when home or away team is a placeholder (Winner/Runner-up/3rd/TBD)."
        tests:
          - not_null

  - name: stg_matches
    description: "One row per match from the football-data.org v4 matches feed (JSON extracted)."
    columns:
      - name: fixture_id
        description: "football-data.org match id."
        tests:
          - unique
          - not_null
      - name: kickoff_utc
        description: "Match kickoff in UTC, from utcDate."
        tests:
          - not_null
      - name: status
        description: "Raw football-data.org match status (e.g. TIMED, FINISHED)."
        tests:
          - not_null
      - name: home_team
        description: "Home team name (homeTeam.name), crosswalk-canonicalized. Null for undetermined knockout fixtures pre-tournament."
      - name: away_team
        description: "Away team name (awayTeam.name), crosswalk-canonicalized. Null for undetermined knockout fixtures pre-tournament."
      - name: home_team_tla
        description: "Home team three-letter FIFA code (homeTeam.tla, e.g. MEX)."
      - name: away_team_tla
        description: "Away team three-letter FIFA code (awayTeam.tla, e.g. KOR)."
      - name: stage
        description: "Tournament stage (e.g. GROUP_STAGE, LAST_16, FINAL)."
        tests:
          - not_null
      - name: last_updated
        description: "Provider's lastUpdated timestamp (payload.lastUpdated): when football-data.org last changed this match. Used as the incremental change-key for fct_result (source_loaded_at), so only matches the provider actually updated are reprocessed."

  - name: stg_standings
    description: "One row per team from the football-data.org v4 TOTAL standings table (JSON extracted). Auxiliary cross-check only."
    columns:
      - name: team_id
        description: "football-data.org team id."
        tests:
          - unique
          - not_null
      - name: team_name
        description: "Team name (team.name), crosswalk-canonicalized."
        tests:
          - not_null
      - name: team_tla
        description: "Team three-letter FIFA code (team.tla)."
      - name: group_label
        description: "Bare group letter A..L (the API 'GROUP_' prefix is stripped to match every other model)."
      - name: points
        description: "Total points."
        tests:
          - not_null

  - name: stg_teams
    description: "One row per real team (country) in the schedule, with optional API team_id and fifa_code (tla)."
    columns:
      - name: team_name
        description: "Country name as it appears in the schedule seed."
        tests:
          - unique
          - not_null
      - name: fifa_code
        description: "Three-letter FIFA code (API tla) for the team, from the fixtures or standings feed; null until the team is seen."

  - name: stg_venues
    description: "One row per distinct (venue, city) pair in the schedule."
    columns:
      - name: venue_name
        description: "Venue name."
        tests:
          - not_null

  # --- FIFA public API (api.fifa.com v3) shot-level staging, Phase 1 ---
  - name: stg_fifa_matches
    description: "One row per FIFA calendar match (competition 17, season 285023). JSON extracted from raw.fifa_matches. Scores/possession are null pre-tournament."
    columns:
      - name: match_id
        description: "FIFA IdMatch."
        tests:
          - unique
          - not_null
      - name: match_date
        description: "Kickoff timestamp (payload.Date, UTC)."
      - name: status
        description: "FIFA MatchStatus (0=played, 1=upcoming, 3/12=live)."
      - name: home_team_name
        description: "Home team name (Home.TeamName[0].Description)."
      - name: away_team_name
        description: "Away team name (Away.TeamName[0].Description)."

  - name: stg_fifa_events
    description: "One row per FIFA timeline event (raw.fifa_events), a 1:1 read of the loader-enriched payload. Empty pre-tournament."
    columns:
      - name: match_id
        description: "FIFA IdMatch this event belongs to."
        tests:
          - not_null
      - name: event_idx
        description: "Zero-based event index within the match timeline."
        tests:
          - not_null
      - name: event_desc
        description: "Event type description (TypeLocalized[0].Description)."

  - name: stg_fifa_shots
    description: "One row per shot event (attempt/goal/penalty goal/penalty missed) from raw.fifa_events. x,y are normalized 0-1 (attacked goal at x=1, y=0.5); shot_distance/shot_angle are xG geometry computed by the loader. Empty pre-tournament."
    columns:
      - name: match_id
        description: "FIFA IdMatch this shot belongs to."
        tests:
          - not_null
      - name: x
        description: "Normalized x in [0,1] (0=centre, 1=goal line). Null when the source event had no coordinates."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: y
        description: "Normalized y in [0,1] (0.5=centre of pitch/goal). Null when the source event had no coordinates."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: is_goal
        description: "True for Goal!/Penalty Goal events."
      - name: is_penalty
        description: "True for penalty shots (Penalty Goal/Penalty missed)."
      - name: shot_outcome
        description: "Best-effort outcome: goal / missed / attempt."
      - name: shot_distance
        description: "Distance from the shot to the goal centre (1, 0.5) in normalized units."
      - name: shot_angle
        description: "Angle (radians) subtended by the goal mouth at the shot location."

  - name: stg_fifa_topscorers
    description: "One row per player from the FIFA season top-scorers feed (PlayerStatsList). Empty pre-tournament."
    columns:
      - name: player_id
        description: "FIFA IdPlayer."
        tests:
          - unique
          - not_null
      - name: player_name
        description: "Player name (PlayerInfo.PlayerName[0].Description)."
      - name: goals
        description: "Goals scored this season."

  - name: stg_fifa_lineups
    description: "One row per player appearance in a match lineup (raw.fifa_lineups), a 1:1 read of the FIFA live-endpoint lineup player object. position_code is FIFA's int code mapped to a readable position. Empty pre-tournament."
    columns:
      - name: player_id
        description: "FIFA IdPlayer."
        tests:
          - not_null
      - name: match_id
        description: "FIFA IdMatch the appearance belongs to."
        tests:
          - not_null
      - name: player_name
        description: "Player name (PlayerName[0].Description)."
      - name: position
        description: "Readable position from position_code (Goalkeeper/Defender/Midfielder/Forward; null for bench/code 4)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_id
            - match_id
