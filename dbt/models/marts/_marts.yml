version: 2

models:
  - name: dim_team
    description: "One row per real team (country). Surrogate team_key from team_name."
    columns:
      - name: team_key
        description: "Surrogate key (hash of team_name)."
        tests:
          - unique
          - not_null
      - name: team_name
        description: "Country name."
        tests:
          - not_null
      - name: fifa_code
        description: "Three-letter FIFA code (API tla, e.g. MEX). Populated for every team that has appeared in the API feed (all 48 on the live path; only the teams present on the partial sample)."
        tests:
          # Every team seen in the feed (team_id not null) must carry its tla.
          # On the live path all 48 teams are seen, so all 48 are non-null; on
          # the partial sample only the feed-present teams are asserted.
          - not_null:
              config:
                where: "team_id is not null"

  - name: dim_venue
    description: "One row per venue (venue + city)."
    columns:
      - name: venue_key
        description: "Surrogate key (hash of venue_name + city)."
        tests:
          - unique
          - not_null

  - name: dim_match
    description: "One row per scheduled match (exactly 104). Placeholder knockout rows have null team keys."
    columns:
      - name: match_key
        description: "Surrogate key (hash of match_no)."
        tests:
          - unique
          - not_null
      - name: match_id
        description: "API fixture_id for this match, reconciled via int_match_map by match_no. Null until the fixture is seen in the feed."
        tests:
          - unique:
              config:
                where: "match_id is not null"
      - name: stage
        description: "Tournament stage."
        tests:
          - accepted_values:
              values: ['group', 'r32', 'r16', 'qf', 'sf', 'third', 'final']
      - name: group_letter
        description: "Group A..L for group-stage rows; empty/null for knockout."
        tests:
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L']
              config:
                where: "group_letter is not null and group_letter != ''"
      - name: venue_key
        description: "FK to dim_venue."
        tests:
          - relationships:
              to: ref('dim_venue')
              field: venue_key

  - name: fct_result
    description: "One row per match with a usable score (finished, or FIFA in-play), with derived result and winner. FIFA is primary (live); football-data is the fallback. is_live distinguishes in-play from final."
    tests:
      - dbt_utils.expression_is_true:
          expression: "home_score >= 0 and away_score >= 0"
    columns:
      - name: match_key
        description: "FK to dim_match. Not null: every scored match must reconcile to a scheduled match via match_no."
        tests:
          - not_null
          - relationships:
              to: ref('dim_match')
              field: match_key
      - name: is_live
        description: "True when the score is from a FIFA in-play match; false when final. Downstream standings/aggregates count only is_live = false."
        tests:
          - not_null
      - name: source
        description: "Provider the row came from: 'fifa' (primary) or 'football-data' (fallback)."
        tests:
          - accepted_values:
              values: ['fifa', 'football-data']
      - name: home_team_key
        description: "FK to dim_team (home side)."
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_key
      - name: away_team_key
        description: "FK to dim_team (away side)."
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_key

  - name: fct_group_standings
    description: "One row per (group_letter, team): recomputed group table with rank and qualification flag."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - group_letter
            - team_key
    columns:
      - name: team_key
        description: "FK to dim_team."
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_key

  - name: fct_group_standings_live
    description: "One row per (group_letter, team) over all 48 group-stage teams: the LIVE standings table powering the groups page. Provisional standings 'as things stand' (an in-play match's current score folded in), plus per-team live status/score. Parallels fct_group_standings (finished-only). When nothing is in play it equals the official table."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - group_letter
            - team_key
    columns:
      - name: team_key
        description: "FK to dim_team."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_key
      - name: rank
        description: "Provisional 1-4 within the group on points/gd/gf/team_name (in-play scores included)."
        tests:
          - not_null
      - name: points
        description: "Provisional points: finished points plus the 3/1/0 the in-play match currently implies."
        tests:
          - not_null
      - name: is_playing
        description: "True when this team is in an in-play group match right now."
        tests:
          - not_null
      - name: live_status
        description: "winning/tied/losing from the in-play match's current score; null when not playing."
        tests:
          - accepted_values:
              values: ['winning', 'tied', 'losing']
              config:
                where: "live_status is not null"

  - name: agg_team_tournament
    description: "One row per team: tournament-level aggregate from fct_result."
    columns:
      - name: team_key
        description: "FK to dim_team."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_key

  - name: fct_squad_quality
    description: "One row per WC 2026 national team: a squad-quality context stat. top5_count is how many of the team's players play club football in a top-5 European league (Premier League, La Liga, Serie A, Bundesliga, Ligue 1), from the Wikipedia squad list (stg_squads) joined to the top5_clubs seed; squad_size is the listed squad; top5_pct is the percentage. Context only (e.g. Spain is stacked with top-5 players yet drew 0-0 with Cape Verde); excluded from results/standings. Empty if the squads load degraded."
    tests:
      - dbt_utils.expression_is_true:
          expression: "top5_count <= squad_size"
    columns:
      - name: team_key
        description: "FK to dim_team (surrogate key)."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_key
      - name: team_name
        description: "Country name (canonical seed name)."
        tests:
          - not_null
      - name: squad_size
        description: "Number of players listed in the team's squad."
        tests:
          - not_null
      - name: top5_count
        description: "Number of squad players whose club is in a top-5 European league."
        tests:
          - not_null
      - name: top5_pct
        description: "top5_count as a percentage of squad_size (0-100)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100

  # --- FIFA xG (Phase 2): pure-SQL scoring from the offline-trained model ---
  - name: dim_fifa_player
    description: "One row per FIFA player (player_id). Player dimension for xG leaderboards: names/teams from lineups, with the season top-scorers feed as a name fallback. position is null for players seen only in the top-scorers feed (no position there)."
    columns:
      - name: player_id
        description: "FIFA IdPlayer."
        tests:
          - unique
          - not_null
      - name: player_name
        description: "Player name, coalesced from lineups then top-scorers."

  - name: fct_shot
    description: "One row per shot (from stg_fifa_shots) with xG scored in pure SQL from the xg_model seed. Penalties use the empirical penalty_xg constant; open-play shots use the logistic model on shot_distance/shot_angle; open-play shots with null coordinates get null xG. Empty pre-tournament."
    columns:
      - name: match_id
        description: "FIFA IdMatch this shot belongs to."
        tests:
          - not_null
      - name: player_id
        description: "FIFA IdPlayer who took the shot."
      - name: team_id
        description: "FIFA IdTeam of the shooting side."
      - name: is_goal
        description: "True if the shot was a goal."
      - name: is_penalty
        description: "True for penalty shots (scored by penalty_xg)."
      - name: xg
        description: "Expected goals for this shot in [0,1]. Null for open-play shots with no coordinates (no geometry to score)."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              config:
                where: "xg is not null"

  - name: agg_player_xg
    description: "One row per player who has taken a shot: xG leaderboard with shots, goals, total_xg, xg_per_shot, and finishing (goals - total_xg). Names via dim_fifa_player. Empty pre-tournament."
    columns:
      - name: player_id
        description: "FIFA IdPlayer."
        tests:
          - unique
          - not_null
      - name: shots
        description: "Number of shots taken."
        tests:
          - not_null
      - name: goals
        description: "Goals scored (open-play + penalties)."
        tests:
          - not_null
      - name: total_xg
        description: "Sum of per-shot xG (null xG contributes 0)."
      - name: finishing
        description: "goals - total_xg: positive = over-performing expectation."

  - name: agg_team_xg
    description: "One row per team that has taken or faced a shot: shots, goals, total_xg, finishing, plus xg_against / goals_against (xG and goals of shots taken against the team in its matches). Empty pre-tournament."
    columns:
      - name: team_id
        description: "FIFA IdTeam."
        tests:
          - unique
          - not_null
      - name: total_xg
        description: "Sum of the team's own shot xG."
      - name: xg_against
        description: "Sum of opponents' shot xG in the team's matches."

  # --- Phase 3: live-feature supporting marts ---
  - name: dim_fifa_team
    description: "One row per FIFA team_id seen in the FIFA calendar feed. The FIFA-side team dimension (separate id system from dim_team) so FIFA shot/xG/top-scorer marts can show a readable team_name. Deduped to one coherent row per team_id. Empty pre-tournament if no FIFA matches are loaded."
    columns:
      - name: team_id
        description: "FIFA IdTeam."
        tests:
          - unique
          - not_null
      - name: team_name
        description: "Team (country) name from the FIFA feed."

  - name: agg_top_scorers
    description: "The golden-boot race: one row per player in the FIFA season top-scorers feed, with team_name resolved via dim_fifa_team. Ordered by goals desc, assists desc, player_name. Empty pre-tournament (0 rows in the feed)."
    columns:
      - name: player_id
        description: "FIFA IdPlayer."
        tests:
          - unique:
              config:
                where: "player_id is not null"
      - name: team_id
        description: "FIFA IdTeam (FK to dim_fifa_team). dim_fifa_team is built from match line-ups in stg_fifa_matches, so a scorer's team resolves only once that team has appeared in a loaded match. On the live path every scorer's team has played; on the trimmed sample the top-scorers feed can reference teams not in the 2 sampled matches, so this FK is asserted at warn severity rather than failing the partial-sample build."
        tests:
          - relationships:
              to: ref('dim_fifa_team')
              field: team_id
              config:
                where: "team_id is not null"
                severity: warn
      - name: goals
        description: "Goals scored this tournament."
      - name: assists
        description: "Assists this tournament (from the feed)."

  - name: agg_team_leaderboard
    description: "Best-performing-teams board on the football-data side. One row per real team (all 48 always present via a LEFT JOIN from dim_team, so the board is never empty pre-tournament). Stats from agg_team_tournament (coalesced to 0), group rank/qualification from fct_group_standings, plus a deterministic overall_rank over points/gd/gf/team_name."
    columns:
      - name: team_key
        description: "FK to dim_team (surrogate key)."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_key
      - name: overall_rank
        description: "1-based tournament ranking over points desc, gd desc, gf desc, team_name asc (deterministic tiebreak)."
        tests:
          - unique
          - not_null
      - name: team_name
        description: "Country name."
        tests:
          - not_null
      - name: group_letter
        description: "Group A..L this team plays in."
      - name: qualified_flag
        description: "Whether the team has qualified for the knockout stage (false until its group is complete)."
      - name: stage_reached
        description: "Furthest stage the team has reached ('group' if no finished matches yet)."

  - name: fct_bracket
    description: "One row per knockout match (dim_match where stage != 'group'; 32 rows). The bracket tree. home_label/away_label resolve actual played team (fct_result -> dim_team) > projected team (int_projected_r32, R32 only, from current standings) > schedule placeholder. is_projected flags an R32 slot shown from the current-standings projection; is_provisional flags that projection as pre-group-stage-complete. Scores/winner_label are null until played. Always 32 rows pre-tournament."
    columns:
      - name: match_no
        description: "Schedule match number (stable id for the fixture)."
        tests:
          - unique
          - not_null
      - name: match_key
        description: "FK to dim_match (surrogate key)."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_match')
              field: match_key
      - name: stage
        description: "Knockout stage (never 'group')."
        tests:
          - accepted_values:
              values: ['r32', 'r16', 'qf', 'sf', 'third', 'final']
      - name: home_label
        description: "Resolved home team name if the match is played, else the schedule placeholder text (e.g. 'Winner Group A')."
        tests:
          - not_null
      - name: away_label
        description: "Resolved away team name if the match is played, else the schedule placeholder text."
        tests:
          - not_null
      - name: home_seed
        description: "Group-position seed tag for the home slot on an R32 projection (e.g. '1A', '2B', '3C'). Null for R16+ rows and for any slot already showing a played team."
      - name: away_seed
        description: "Group-position seed tag for the away slot on an R32 projection. Null for R16+ rows and for any slot already showing a played team."
      - name: home_clinched
        description: "True when the home slot's projected group position is mathematically clinched (confirmed), false when still projected from current standings. Null when not an active R32 projection slot (R16+, or already played)."
      - name: away_clinched
        description: "True when the away slot's projected group position is mathematically clinched (confirmed), false when still projected. Null when not an active R32 projection slot."
      - name: is_projected
        description: "True for an R32 slot filled from the current-standings projection (no actual result yet)."
        tests:
          - not_null
      - name: is_provisional
        description: "True when the projected matchup is still provisional (group stage not complete)."
        tests:
          - not_null
