version: 2

models:
  - name: int_match_map
    description: >
      One row per API fixture mapping fixture_id to its seed match_no. Group
      matches are matched on the unordered team set (either orientation);
      knockout matches are matched by chronological position within each stage.
      This is the single id-based reconciliation point between the live feed and
      the schedule seed. The match_map_is_one_to_one singular test asserts the
      mapping is 1:1 in both directions.
    columns:
      - name: fixture_id
        description: "football-data.org match id."
        tests:
          - unique
          - not_null
      - name: match_no
        description: "Seed match number (1..104) this fixture reconciles to."
        tests:
          - unique
          - not_null

  - name: int_fifa_match_map
    description: >
      One row per FIFA fixture mapping fifa_match_id to its seed match_no. The
      FIFA-side analogue of int_match_map (FIFA uses its own ids and team-name
      spellings). Group matches are matched on the unordered, crosswalk-
      canonicalized team set within the same group_letter; knockout matches by
      chronological position within each stage. The fifa_match_map_is_one_to_one
      singular test asserts the mapping is 1:1 in both directions.
    columns:
      - name: fifa_match_id
        description: "FIFA IdMatch."
        tests:
          - unique
          - not_null
      - name: match_no
        description: "Seed match number (1..104) this FIFA fixture reconciles to."
        tests:
          - unique
          - not_null

  - name: int_results_scored
    description: >
      One row per scheduled match (match_no) that has a usable score, preferring
      FIFA (live, first-party; status in 0/3/12) and falling back to
      football-data.org (status FINISHED). Carries the reconciled match_no and
      group_letter, canonical home/away team names, derived result and points,
      an is_live flag (true only for FIFA in-play rows), the source, and the
      passthrough fixture_id (football-data) / fifa_match_id (FIFA).
    columns:
      - name: match_no
        description: "Seed match number (1..104), unique per scored match."
        tests:
          - unique
          - not_null
      - name: is_live
        description: "True when the score is from a FIFA in-play match (status 3/12); false for finished matches. Downstream standings/aggregates filter to is_live = false."
        tests:
          - not_null
      - name: source
        description: "Provider the row came from: 'fifa' (primary) or 'football-data' (fallback)."
        tests:
          - not_null
          - accepted_values:
              values: ['fifa', 'football-data']

  - name: int_group_table
    description: >
      One row per (group_letter, team), recomputed from finished group matches.
      won/drawn/lost are derived from the points column. Ranked within each group
      by the full FIFA World Cup 2026 order (Art. 13): points, then head-to-head
      among teams level on points (h2h points/gd/gf), then overall gd, overall gf,
      then the seeded FIFA World Ranking (conduct/card score is not ingested and is
      skipped), with team_name as the deterministic final key.

  - name: int_group_table_live
    description: >
      One row per (group_letter, team) over ALL 48 group-stage teams: the LIVE
      provisional table. Unlike int_group_table (finished-only), it folds the
      current score of an in-play match into the standings "as things stand" and
      adds per-team live status/score. Left-joined from dim_team so every group
      always has 4 teams (a determinate 3rd place for the bracket resolver).
      Ranked by the same FIFA Art. 13 order as int_group_table (points,
      head-to-head, overall gd/gf, FIFA World Ranking) on the provisional points.
    columns:
      - name: rank
        description: "Provisional 1-4 within the group (in-play scores included)."
        tests:
          - not_null
      - name: fifa_rank
        description: >
          The team's FIFA/Coca-Cola Men's World Ranking position (from the
          fifa_world_ranking seed, June 2026 edition), used as a tiebreaker. The
          not_null test doubles as a gate that the seed names cover all 48 teams.
        tests:
          - not_null

  - name: int_group_clinch
    description: >
      One row per (group_letter, position) over the 12 groups x 4 positions (48
      rows once all groups have their teams): whether the team currently in that
      group position has MATHEMATICALLY clinched finishing in EXACTLY that
      position. A dbt python model that enumerates every win/draw/loss combination
      of a group's remaining fixtures (3^k, k<=6); a position is clinched when, in
      every combination, no other team can finish above the team beyond what the
      position allows. It is HEAD-TO-HEAD aware (FIFA Art. 13 step one): a team
      that has beaten everyone who can still match its points is locked even when
      it is not points-separated (e.g. a group winner confirmed on head-to-head).
      It is SOUND (never a false positive): only points and head-to-head points
      (both decided by results, not scorelines) are used, so any tie that
      head-to-head leaves level is treated as still open, since goal margins are
      not enumerated. A completed group is final, so all its positions are
      clinched. Drives the "(!)" confirmed vs "(proj)" projected marker on the
      bracket page.
    columns:
      - name: group_letter
        description: "Group A..L."
        tests:
          - not_null
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L']
      - name: position
        description: "Group position 1-4 (1 = winner, 2 = runner-up, 3 = third)."
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
      - name: team_name
        description: "Team currently in that position (finished-results order)."
        tests:
          - not_null
      - name: is_clinched
        description: "True when the position is mathematically locked for that team."
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: int_projected_r32
    description: >
      The projected Round of 32 (16 fixtures, match_no 73-88), resolved from the
      LIVE provisional standings via the FIFA Annexe C third-place seeding. A dbt
      python model wrapping the committed resolver (include/third_place_seeding.py);
      recomputed every run so the matchups track the standings "as things stand".
      is_provisional is true until all 72 group matches are final, then they lock.
    columns:
      - name: match_no
        description: "R32 bracket position (73-88)."
        tests:
          - unique
          - not_null
      - name: home_team
        description: "Projected home team name (resolved from current standings)."
        tests:
          - not_null
      - name: away_team
        description: "Projected away team name (winner-vs-runner-up, or the Annexe C third)."
        tests:
          - not_null
